# v* 태그를 올리면 Windows 설치 파일을 빌드해 GitHub Releases 에 올린다.
# 초안 릴리스에 설치 파일·blockmap·latest.yml 을 다 올린 뒤 공개하고, 설치된 앱이 latest.yml 을 보고 새 버전을 알린다.
# 절차: release.bat (버전을 입력하면 버전 커밋·태그를 만들어 올린다)
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # electron-builder 와 gh 가 같이 쓴다(Actions 기본 토큰)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 태그와 package.json 버전이 다르면 릴리스 이름과 latest.yml 의 버전이 어긋난다
      - name: 태그와 버전 확인
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $expected 이 다릅니다." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # electron-builder 26.15.3 은 설치 파일과 blockmap 을 동시에 올리면서 같은 태그의 릴리스를 두 개 만들 수 있다
      # (게시자를 만드는 동안 캐시에 넣기 전에 await 해서 둘이 따로 만든다). 그러면 태그 주소가 한쪽만 가리켜 다른 쪽 파일이 404 가 된다.
      # 초안을 먼저 만들어 두면 둘 다 그 초안을 찾아 올린다. 다시 실행할 때는 이미 있는 릴리스를 쓴다
      - name: 초안 릴리스 만들기
        shell: bash
        run: |
          count=$(gh api "repos/$GH_REPO/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          if [ "$count" = "0" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
          fi

      # 설치 파일·blockmap·latest.yml 을 그 초안에 올린다
      - name: 빌드·업로드
        run: npx electron-builder --win --publish always

      # 파일이 다 올라간 뒤에 공개한다. 공개 전에는 설치된 앱이 새 버전을 보지 못한다
      - name: 릴리스 공개
        shell: bash
        run: |
          ids=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ -z "$ids" ] || [ "$(printf '%s\n' "$ids" | wc -l)" != "1" ]; then
            echo "태그 $GITHUB_REF_NAME 의 릴리스가 하나가 아닙니다: $ids" >&2
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$ids" -F draft=false -f make_latest=true >/dev/null
          echo "공개했습니다: https://github.com/$GH_REPO/releases/tag/$GITHUB_REF_NAME"
