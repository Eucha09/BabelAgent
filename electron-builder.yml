appId: com.babelagent.app
productName: Babel Agent
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
  - '!**/*.map'
  # Agent SDK 에 든 Claude Code 실행 파일(플랫폼 패키지, 약 280 MB)은 넣지 않는다.
  # 앱은 사용자가 공식 설치한 Claude Code 를 쓰고 시작할 때 최신으로 업데이트한다(설치 안내 포함).
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*{,/**}'
# SDK 의 자바스크립트는 asar 밖에 둔다(SDK 가 자기 파일을 실제 경로로 읽는 경우 대비)
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # GitHub 은 자산 이름의 공백을 바꿔 올리므로 latest.yml 과 어긋나지 않게 공백 없는 이름을 쓴다
  artifactName: BabelAgent-Setup-${version}.${ext}
# 앱 자동 업데이트(electron-updater)가 새 버전을 찾는 곳. 빌드하면 latest.yml 과 앱 안의 app-update.yml 이 생긴다.
# 올리기는 GitHub Actions(.github/workflows/release.yml)가 v* 태그에서 한다. 저장소를 바꾸면 src/main/update/app-update.ts 의 RELEASES_URL 도 맞춘다.
publish:
  provider: github
  owner: Eucha09
  repo: BabelAgent
  releaseType: release
