appId: com.babelagent.app
productName: Babel Agent
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
  - '!**/*.map'
# SDK가 CLI 실행 파일을 참조하므로 asar 안에 가두지 않는다
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
